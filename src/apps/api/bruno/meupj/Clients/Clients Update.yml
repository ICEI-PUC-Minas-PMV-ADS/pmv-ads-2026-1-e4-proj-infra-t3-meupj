info:
  name: Clients Update
  type: http
  seq: 3

http:
  method: PUT
  url: '{{baseUrl}}/api/clients/{{clientId}}'
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: sessionCookie
  auth: inherit
  body:
    mimeType: application/json
    text: |
      {
        "nome": "João Silva Updated",
        "email": "joao.updated@example.com",
        "telefone": "31 99999-1234"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
