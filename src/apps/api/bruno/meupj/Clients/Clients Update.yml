info:
  name: Clients Update
  type: http
  seq: 4

http:
  method: PUT
  url: '{{baseUrl}}/api/clients/{{clientId}}'
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: '{{sessionCookie}}'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "João Silva Updated",
        "email": "joao.updated@example.com",
        "phone": "31 99999-1234",
        "notes": "Cliente atualizado via Bruno"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
