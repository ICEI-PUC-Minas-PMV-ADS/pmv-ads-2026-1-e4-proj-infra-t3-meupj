info:
  name: Clients Create
  type: http
  seq: 2

http:
  method: POST
  url: '{{baseUrl}}/api/clients'
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: '{{sessionCookie}}'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "João da Silva",
        "type": "individual",
        "document": "123.456.789-00",
        "email": "joao@example.com",
        "phone": "31 98888-5678",
        "origin": "indicacao",
        "birthDate": "1985-07-22",
        "notes": "Cliente pontual",
        "address": {
          "zipCode": "31270-080",
          "street": "Rua das Flores",
          "number": "42",
          "complement": "Apto 5",
          "district": "Santa Efigênia",
          "city": "Belo Horizonte",
          "state": "MG",
          "country": "Brasil"
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseBody = res.getBody();

        if (responseBody === undefined || responseBody === null || responseBody === "") {
          throw new Error("Missing response body in Clients Create");
        }

        const body =
          typeof responseBody === "string" ? JSON.parse(responseBody) : responseBody;

        if (!body || typeof body !== "object" || typeof body._id !== "string") {
          throw new Error("Client id not found in Clients Create response");
        }

        bru.setEnvVar("clientId", body._id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
