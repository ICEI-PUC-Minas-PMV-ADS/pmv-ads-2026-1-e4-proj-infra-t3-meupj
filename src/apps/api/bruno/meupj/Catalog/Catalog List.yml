info:
  name: Catalog List
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/api/catalog'
  params:
    - name: page
      value: '1'
      disabled: true
    - name: limit
      value: '20'
      disabled: true
    - name: q
      value: sample
      disabled: true
    - name: type
      value: product
      disabled: true
    - name: sortBy
      value: createdAt
      disabled: true
    - name: sortOrder
      value: desc
      disabled: true
  headers:
    - name: Cookie
      value: '{{sessionCookie}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
