info:
  name: Orders Update
  type: http
  seq: 4

http:
  method: PUT
  url: '{{baseUrl}}/api/orders/{{orderId}}'
  headers:
    - name: Cookie
      value: '{{sessionCookie}}'
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "pendingApproval",
        "discount": 5,
        "reference": "Pedido atualizado via Bruno"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
