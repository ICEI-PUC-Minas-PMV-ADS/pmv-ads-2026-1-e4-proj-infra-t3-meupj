info:
  name: Orders Update
  type: http
  seq: 3

http:
  method: PUT
  url: '{{baseUrl}}/api/orders/PUT_ORDER_ID_HERE'
  headers:
    - name: Cookie
      value: sessionCookie
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "pendingApproval",
        "discount": 5.00
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
