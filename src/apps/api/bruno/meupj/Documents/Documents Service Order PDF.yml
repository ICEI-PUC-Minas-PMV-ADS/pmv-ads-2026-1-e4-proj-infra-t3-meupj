info:
  name: Documents Service Order PDF
  type: http
  seq: 4

http:
  method: GET
  url: '{{baseUrl}}/api/documents/service-order/{{orderId}}/pdf'
  headers:
    - name: Cookie
      value: '{{sessionCookie}}'
    - name: Accept
      value: application/pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
