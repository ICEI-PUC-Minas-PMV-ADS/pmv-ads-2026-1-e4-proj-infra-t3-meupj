info:
  name: Documents Receipt PDF
  type: http
  seq: 6

http:
  method: GET
  url: '{{baseUrl}}/api/documents/receipt/{{transactionId}}/pdf'
  headers:
    - name: Cookie
      value: '{{sessionCookie}}'
    - name: Accept
      value: application/pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
