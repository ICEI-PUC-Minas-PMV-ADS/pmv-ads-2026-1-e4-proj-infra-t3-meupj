info:
  name: Transactions Get By Id
  type: http
  seq: 4

http:
  method: GET
  url: '{{baseUrl}}/api/transactions/{{transactionId}}'
  headers:
    - name: Cookie
      value: '{{sessionCookie}}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseBody = res.getBody();

        if (responseBody === undefined || responseBody === null || responseBody === "") {
          throw new Error("Missing response body in Transactions Get By Id");
        }

        const body =
          typeof responseBody === "string" ? JSON.parse(responseBody) : responseBody;

        if (!body || typeof body !== "object" || typeof body._id !== "string") {
          throw new Error("Transaction id not found in Transactions Get By Id response");
        }

        bru.setEnvVar("transactionId", body._id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
